<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#05070d"
  >

  <title>NEXUS | شهر مخفی</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070d;
      color: #ffffff;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      touch-action: manipulation;
    }

    button {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOADING
    ========================= */

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at center,
          #111a2d 0%,
          #05070d 65%
        );
    }

    .loading-box {
      text-align: center;
    }

    .loading-logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 8px;
    }

    .loading-subtitle {
      margin-top: 8px;
      opacity: 0.65;
      font-size: 14px;
    }

    .loader {
      width: 42px;
      height: 42px;
      margin: 25px auto 0;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       LANGUAGE SCREEN
    ========================= */

    #language-screen {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background:
        radial-gradient(
          circle at 50% 30%,
          #172642,
          #05070d 70%
        );
    }

    .language-box {
      width: min(420px, 100%);
      padding: 30px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      background: rgba(10,14,25,0.9);
      box-shadow: 0 25px 80px rgba(0,0,0,0.5);
      text-align: center;
    }

    .language-logo {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 6px;
    }

    .language-subtitle {
      margin-top: 6px;
      margin-bottom: 30px;
      opacity: 0.6;
    }

    .language-box h2 {
      margin-bottom: 20px;
      font-size: 18px;
    }

    .language-buttons {
      display: grid;
      gap: 12px;
    }

    .language-button {
      width: 100%;
      padding: 15px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      color: #fff;
      cursor: pointer;
    }

    .language-button:active {
      transform: scale(0.98);
    }

    /* =========================
       GAME
    ========================= */

    #game {
      position: fixed;
      inset: 0;
    }

    #game-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    #game-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* =========================
       HUD
    ========================= */

    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;

      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;

      pointer-events: none;
    }

    .hud-card {
      min-width: 0;
      padding: 9px 7px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 13px;
      background: rgba(5,8,15,0.72);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    .hud-label {
      display: block;
      font-size: 9px;
      opacity: 0.55;
      margin-bottom: 3px;
    }

    .hud-value {
      display: block;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================
       CITY VALUE
    ========================= */

    #city-value-box {
      position: absolute;
      top: 75px;
      left: 12px;
      z-index: 20;

      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      background: rgba(5,8,15,0.72);
      backdrop-filter: blur(12px);
    }

    #city-value-box span {
      font-size: 10px;
      opacity: 0.55;
      margin-left: 5px;
    }

    #city-value {
      font-weight: 800;
      font-size: 13px;
    }

    /* =========================
       MOVEMENT
    ========================= */

    #movement {
      position: absolute;
      left: 18px;
      bottom: 105px;
      z-index: 30;

      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(2, 46px);
      gap: 5px;
    }

    .move-button {
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 12px;
      background: rgba(5,8,15,0.78);
      color: #fff;
      font-size: 19px;
      backdrop-filter: blur(10px);
      cursor: pointer;
    }

    .move-button:active {
      transform: scale(0.92);
      background: rgba(255,255,255,0.15);
    }

    #move-up {
      grid-column: 2;
    }

    #move-left {
      grid-column: 1;
      grid-row: 2;
    }

    #move-down {
      grid-column: 2;
      grid-row: 2;
    }

    #move-right {
      grid-column: 3;
      grid-row: 2;
    }

    /* =========================
       ACTION PANEL
    ========================= */

    #action-panel {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 100px;
      z-index: 50;

      padding: 18px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      background: rgba(7,10,18,0.92);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    #panel-title {
      margin: 0 0 7px;
      font-size: 20px;
    }

    #panel-text {
      margin: 0 0 15px;
      opacity: 0.65;
      font-size: 13px;
      line-height: 1.7;
    }

    .panel-actions {
      display: flex;
      gap: 8px;
    }

    .panel-button {
      flex: 1;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: #ffffff;
      color: #05070d;
      font-weight: 800;
      cursor: pointer;
    }

    .panel-close {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    #bottom-nav {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 40;

      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;

      padding: 7px;

      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      background: rgba(5,8,15,0.82);
      backdrop-filter: blur(16px);
    }

    .nav-button {
      min-width: 0;
      padding: 9px 4px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: #fff;
      opacity: 0.65;
      cursor: pointer;
    }

    .nav-button:active {
      background: rgba(255,255,255,0.1);
      opacity: 1;
    }

    .nav-icon {
      display: block;
      font-size: 17px;
      margin-bottom: 3px;
    }

    .nav-text {
      display: block;
      font-size: 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================
       MODAL
    ========================= */

    #modal {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 22px;

      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(7px);
    }

    .modal-box {
      width: min(420px, 100%);
      padding: 22px;

      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;

      background: #0b101c;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }

    #modal-title {
      margin: 0 0 10px;
      font-size: 20px;
    }

    #modal-text {
      margin: 0 0 18px;
      line-height: 1.8;
      opacity: 0.7;
      font-size: 14px;
    }

    #close-modal {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: #fff;
      color: #05070d;
      font-weight: 800;
      cursor: pointer;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 420px) {
      #hud {
        gap: 4px;
        left: 7px;
        right: 7px;
      }

      .hud-card {
        padding: 8px 4px;
      }

      .hud-label {
        font-size: 8px;
      }

      .hud-value {
        font-size: 11px;
      }

      #city-value-box {
        top: 69px;
        left: 7px;
      }

      #movement {
        left: 10px;
        bottom: 105px;
      }
    }

    @media (min-width: 700px) {
      #action-panel {
        left: 50%;
        right: auto;
        width: 430px;
        transform: translateX(-50%);
      }

      #movement {
        left: 25px;
        bottom: 110px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOADING
  ========================= -->

  <div id="loading">

    <div class="loading-box">

      <div class="loading-logo">
        NEXUS
      </div>

      <div class="loading-subtitle">
        Secret City
      </div>

      <div class="loader"></div>

    </div>

  </div>

  <!-- =========================
       LANGUAGE
  ========================= -->

  <div id="language-screen" class="hidden">

    <div class="language-box">

      <div class="language-logo">
        NEXUS
      </div>

      <div class="language-subtitle">
        Secret City
      </div>

      <h2 data-i18n="chooseLanguage">
        زبان را انتخاب کنید
      </h2>

      <div class="language-buttons">

        <button
          class="language-button"
          onclick="window.NEXUS_setLanguage('fa')"
        >
          🇮🇷 فارسی
        </button>

        <button
          class="language-button"
          onclick="window.NEXUS_setLanguage('en')"
        >
          🇬🇧 English
        </button>

      </div>

    </div>

  </div>

  <!-- =========================
       GAME
  ========================= -->

  <main id="game">

    <div id="game-container"></div>

    <!-- HUD -->

    <section id="hud">

      <div class="hud-card">
        <span
          class="hud-label"
          data-i18n="nex"
        >
          NEX
        </span>

        <span
          id="nex-value"
          class="hud-value"
        >
          10,000
        </span>
      </div>

      <div class="hud-card">
        <span
          class="hud-label"
          data-i18n="energy"
        >
          انرژی
        </span>

        <span
          id="energy-value"
          class="hud-value"
        >
          100
        </span>
      </div>

      <div class="hud-card">
        <span
          class="hud-label"
          data-i18n="level"
        >
          سطح
        </span>

        <span
          id="level-value"
          class="hud-value"
        >
          1
        </span>
      </div>

      <div class="hud-card">
        <span
          class="hud-label"
          data-i18n="xp"
        >
          تجربه
        </span>

        <span
          id="xp-value"
          class="hud-value"
        >
          0
        </span>
      </div>

    </section>

    <!-- CITY VALUE -->

    <div id="city-value-box">

      <span data-i18n="cityValue">
        ارزش شهر
      </span>

      <strong id="city-value">
        1,000
      </strong>

    </div>

    <!-- MOVEMENT -->

    <div id="movement">

      <button
        id="move-up"
        class="move-button"
        aria-label="Move up"
      >
        ▲
      </button>

      <button
        id="move-left"
        class="move-button"
        aria-label="Move left"
      >
        ◀
      </button>

      <button
        id="move-down"
        class="move-button"
        aria-label="Move down"
      >
        ▼
      </button>

      <button
        id="move-right"
        class="move-button"
        aria-label="Move right"
      >
        ▶
      </button>

    </div>

    <!-- BUILDING ACTION PANEL -->

    <section
      id="action-panel"
      class="hidden"
    >

      <h2 id="panel-title">
        NEXUS
      </h2>

      <p id="panel-text">
        ...
      </p>

      <div class="panel-actions">

        <button
          id="operation-button"
          class="panel-button"
        >
          ⚡
          <span data-i18n="operations">
            عملیات
          </span>
        </button>

        <button
          id="close-panel"
          class="panel-button panel-close"
          data-i18n="close"
        >
          بستن
        </button>

      </div>

    </section>

    <!-- BOTTOM NAV -->

    <nav id="bottom-nav">

      <button
        class="nav-button"
        data-nav="operations"
      >
        <span class="nav-icon">⚡</span>
        <span
          class="nav-text"
          data-i18n="operations"
        >
          عملیات
        </span>
      </button>

      <button
        class="nav-button"
        data-nav="missions"
      >
        <span class="nav-icon">🎯</span>
        <span
          class="nav-text"
          data-i18n="missions"
        >
          ماموریت‌ها
        </span>
      </button>

      <button
        class="nav-button"
        data-nav="market"
      >
        <span class="nav-icon">🏪</span>
        <span
          class="nav-text"
          data-i18n="marketNav"
        >
          بازار
        </span>
      </button>

      <button
        class="nav-button"
        data-nav="ranking"
      >
        <span class="nav-icon">🏆</span>
        <span
          class="nav-text"
          data-i18n="ranking"
        >
          رتبه‌بندی
        </span>
      </button>

      <button
        class="nav-button"
        data-nav="profile"
      >
        <span class="nav-icon">👤</span>
        <span
          class="nav-text"
          data-i18n="profile"
        >
          پروفایل
        </span>
      </button>

    </nav>

    <!-- MODAL -->

    <div
      id="modal"
      class="hidden"
    >

      <div class="modal-box">

        <h2 id="modal-title">
          NEXUS
        </h2>

        <p id="modal-text">
          ...
        </p>

        <button
          id="close-modal"
          data-i18n="close"
        >
          بستن
        </button>

      </div>

    </div>

  </main>

  <!-- =========================
       CONNECT GAME.JS
  ========================= -->

  <script type="module">

    import "./game.js";

    /*
      game.js exposes the language
      function here so the language
      buttons can use it.
    */

    window.NEXUS_setLanguage = function(language) {

      if (
        window.NEXUS &&
        typeof window.NEXUS.setLanguage === "function"
      ) {

        window.NEXUS.setLanguage(language);

      }

    };

  </script>

</body>
</html>
