<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>NEXUS | شهر مخفی</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070d;
      color: white;
      font-family: Arial, sans-serif;
    }

    button {
      font-family: inherit;
      border: 0;
      cursor: pointer;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background:
        radial-gradient(circle at center, #18233b 0%, #080b13 45%, #030408 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity .4s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 5px;
      color: #55d6ff;
      text-shadow: 0 0 25px rgba(85,214,255,.7);
    }

    .loading-text {
      margin-top: 15px;
      color: #aab6ca;
      font-size: 14px;
    }

    .loader {
      width: 42px;
      height: 42px;
      margin-top: 25px;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: #55d6ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #language-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, #18233b 0%, #080b13 50%, #030408 100%);
      padding: 25px;
    }

    .language-box {
      width: min(390px, 100%);
      padding: 35px 25px;
      text-align: center;
      border-radius: 24px;
      background: rgba(15,22,36,.94);
      border: 1px solid rgba(85,214,255,.25);
      box-shadow: 0 20px 70px rgba(0,0,0,.55);
    }

    .language-box h1 {
      margin: 0;
      font-size: 34px;
      color: #55d6ff;
      letter-spacing: 3px;
    }

    .language-box p {
      color: #aab6ca;
      margin: 12px 0 28px;
    }

    .lang-btn {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border-radius: 14px;
      background: #17243a;
      color: white;
      font-size: 17px;
      border: 1px solid rgba(85,214,255,.2);
    }

    .lang-btn:active {
      transform: scale(.98);
      background: #203451;
    }

    #game-container {
      position: fixed;
      inset: 0;
      display: none;
      background: #05070d;
    }

    #game-container.active {
      display: block;
    }

    #city {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
    }

    .hud-box {
      background: rgba(7,12,22,.86);
      border: 1px solid rgba(85,214,255,.22);
      border-radius: 14px;
      padding: 9px 12px;
      min-width: 95px;
      backdrop-filter: blur(8px);
    }

    .hud-label {
      color: #8290a8;
      font-size: 10px;
      margin-bottom: 3px;
    }

    .hud-value {
      color: white;
      font-weight: bold;
      font-size: 14px;
    }

    #city-info {
      position: absolute;
      top: 78px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(7,12,22,.82);
      border: 1px solid rgba(85,214,255,.2);
      border-radius: 15px;
      padding: 8px 16px;
      color: #dce8f7;
      font-size: 12px;
      pointer-events: none;
      white-space: nowrap;
    }

    #controls {
      position: absolute;
      bottom: 92px;
      left: 15px;
      z-index: 30;
      display: grid;
      grid-template-columns: 52px 52px 52px;
      grid-template-rows: 52px 52px;
      gap: 5px;
    }

    .control {
      border-radius: 15px;
      background: rgba(10,17,30,.88);
      color: white;
      border: 1px solid rgba(85,214,255,.2);
      font-size: 20px;
    }

    .control.up {
      grid-column: 2;
    }

    .control.left {
      grid-column: 1;
      grid-row: 2;
    }

    .control.down {
      grid-column: 2;
      grid-row: 2;
    }

    .control.right {
      grid-column: 3;
      grid-row: 2;
    }

    #action-panel {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      width: min(360px, calc(100% - 150px));
      display: none;
    }

    .action-box {
      background: rgba(7,12,22,.94);
      border: 1px solid rgba(85,214,255,.3);
      border-radius: 18px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.5);
    }

    .action-title {
      font-size: 17px;
      font-weight: bold;
      color: #55d6ff;
      margin-bottom: 6px;
    }

    .action-desc {
      color: #aab6ca;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: #55d6ff;
      color: #04101a;
      font-weight: bold;
    }

    #bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      height: 70px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(5,9,17,.95);
      border-top: 1px solid rgba(85,214,255,.15);
      backdrop-filter: blur(12px);
    }

    .nav-btn {
      background: transparent;
      color: #78859b;
      font-size: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .nav-icon {
      font-size: 20px;
    }

    .nav-btn.active {
      color: #55d6ff;
    }

    #modal {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.65);
    }

    #modal.show {
      display: flex;
    }

    .modal-box {
      width: min(420px, 100%);
      max-height: 80vh;
      overflow-y: auto;
      background: #0d1524;
      border: 1px solid rgba(85,214,255,.25);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 25px 80px rgba(0,0,0,.65);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: bold;
      color: #55d6ff;
    }

    .close-btn {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #182338;
      color: white;
      font-size: 18px;
    }

    .modal-content {
      color: #d3dbea;
      line-height: 1.8;
      font-size: 14px;
    }

    .option-btn {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 12px;
      background: #17243a;
      color: white;
      border: 1px solid rgba(85,214,255,.18);
      text-align: right;
    }

    .option-btn:hover {
      background: #203451;
    }

    .error-box {
      color: #ff8d8d;
      text-align: center;
      padding: 30px;
      line-height: 2;
    }
  </style>
</head>

<body>

  <div id="loading-screen">
    <div class="loading-logo">NEXUS</div>
    <div class="loading-text">در حال ورود به شهر مخفی...</div>
    <div class="loader"></div>
  </div>

  <div id="language-screen">
    <div class="language-box">
      <h1>NEXUS</h1>
      <p>شهر مخفی در انتظار توست</p>

      <button class="lang-btn" onclick="window.NEXUS_setLanguage('fa')">
        🇮🇷 فارسی
      </button>

      <button class="lang-btn" onclick="window.NEXUS_setLanguage('en')">
        🇬🇧 English
      </button>
    </div>
  </div>

  <div id="game-container">

    <div id="city"></div>

    <div id="hud">
      <div class="hud-box">
        <div class="hud-label" data-i18n="nex">NEX</div>
        <div class="hud-value" id="nex-value">10,000</div>
      </div>

      <div class="hud-box">
        <div class="hud-label" data-i18n="energy">انرژی</div>
        <div class="hud-value" id="energy-value">100</div>
      </div>

      <div class="hud-box">
        <div class="hud-label" data-i18n="level">سطح</div>
        <div class="hud-value" id="level-value">1</div>
      </div>
    </div>

    <div id="city-info">
      🏙️ <span data-i18n="cityValue">ارزش شهر</span>:
      <span id="city-value">100,000</span>
    </div>

    <div id="action-panel">
      <div class="action-box">
        <div class="action-title" id="action-title">ساختمان</div>
        <div class="action-desc" id="action-desc"></div>
        <button class="action-btn" id="action-button">ورود</button>
      </div>
    </div>

    <div id="controls">
      <button class="control up" data-move="up">▲</button>
      <button class="control left" data-move="left">◀</button>
      <button class="control down" data-move="down">▼</button>
      <button class="control right" data-move="right">▶</button>
    </div>

    <div id="bottom-nav">

      <button class="nav-btn active" data-nav="operations">
        <span class="nav-icon">🎯</span>
        <span data-i18n="operations">عملیات</span>
      </button>

      <button class="nav-btn" data-nav="missions">
        <span class="nav-icon">📁</span>
        <span data-i18n="missions">ماموریت</span>
      </button>

      <button class="nav-btn" data-nav="market">
        <span class="nav-icon">🛒</span>
        <span data-i18n="market">بازار</span>
      </button>

      <button class="nav-btn" data-nav="ranking">
        <span class="nav-icon">🏆</span>
        <span data-i18n="ranking">رتبه‌بندی</span>
      </button>

      <button class="nav-btn" data-nav="profile">
        <span class="nav-icon">👤</span>
        <span data-i18n="profile">پروفایل</span>
      </button>

    </div>
  </div>

  <div id="modal">
    <div class="modal-box">

      <div class="modal-header">
        <div class="modal-title" id="modal-title"></div>
        <button class="close-btn" id="modal-close">×</button>
      </div>

      <div class="modal-content" id="modal-content"></div>

    </div>
  </div>

  <script>
    /*
      این صفحه عمداً Loading را بعد از آماده شدن DOM
      به صورت قطعی مخفی می‌کند.
    */

    window.addEventListener("error", function(event) {
      console.error("NEXUS error:", event.error || event.message);

      const loading = document.getElementById("loading-screen");

      if (loading) {
        loading.innerHTML = `
          <div class="error-box">
            <h2>خطا در اجرای بازی</h2>
            <p>لطفاً صفحه را یک بار Refresh کن.</p>
          </div>
        `;
      }
    });

    window.addEventListener("DOMContentLoaded", function() {
      setTimeout(function() {
        const loading = document.getElementById("loading-screen");

        if (loading) {
          loading.classList.add("hidden");

          setTimeout(function() {
            loading.style.display = "none";
          }, 500);
        }
      }, 1200);
    });

    /*
      اگر game.js با تأخیر لود شود، صفحه برای همیشه روی Loading
      نمی‌ماند.
    */

    window.NEXUS_setLanguage = function(language) {

      if (window.NEXUS &&
          typeof window.NEXUS.setLanguage === "function") {

        window.NEXUS.setLanguage(language);

      } else if (typeof window.NEXUS_setLanguage_internal === "function") {

        window.NEXUS_setLanguage_internal(language);

      } else {

        const screen = document.getElementById("language-screen");
        const game = document.getElementById("game-container");

        if (language === "fa" || language === "en") {

          localStorage.setItem("NEXUS_LANGUAGE", language);

          if (screen) {
            screen.style.display = "none";
          }

          if (game) {
            game.classList.add("active");
          }
        }
      }
    };
  </script>

  <script type="module" src="./game.js"></script>

</body>
</html>
