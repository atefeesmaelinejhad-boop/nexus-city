<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#070a12"
    >

    <title>NEXUS | شهر مخفی</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #070a12;
            color: #ffffff;
            font-family:
                Arial,
                Tahoma,
                sans-serif;
        }

        body {
            touch-action: none;
        }

        #app {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        #game {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ------------------------------
           LOADING
        ------------------------------ */

        #loadingScreen {
            position: absolute;
            inset: 0;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #17233d 0%,
                    #070a12 65%
                );
        }

        .loadingBox {
            width: min(86%, 360px);
            text-align: center;
        }

        .logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 6px;
        }

        .logoSub {
            margin-top: 8px;
            color: #7d8aa8;
            font-size: 14px;
        }

        .loadingBar {
            margin-top: 30px;
            height: 5px;
            border-radius: 20px;
            background: #20283b;
            overflow: hidden;
        }

        .loadingProgress {
            width: 35%;
            height: 100%;
            background: #6d7cff;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {

            0% {
                transform: translateX(-120%);
            }

            100% {
                transform: translateX(400%);
            }

        }

        /* ------------------------------
           LANGUAGE
        ------------------------------ */

        #languageScreen {
            position: absolute;
            inset: 0;
            z-index: 900;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background:
                radial-gradient(
                    circle at top,
                    #19284a,
                    #070a12 70%
                );
        }

        .languageBox {
            width: min(92%, 390px);

            padding: 32px 24px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 24px;

            background:
                rgba(15,20,35,.92);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,.45);

            text-align: center;
        }

        .languageTitle {
            font-size: 28px;
            font-weight: 800;
        }

        .languageText {
            margin-top: 10px;
            color: #929bb0;
            font-size: 14px;
        }

        .languageButtons {
            display: grid;
            gap: 12px;
            margin-top: 28px;
        }

        .languageButton {
            width: 100%;
            padding: 16px;

            border: 1px solid
                rgba(255,255,255,.08);

            border-radius: 16px;

            background: #141b2d;
            color: #ffffff;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;
        }

        .languageButton:active {
            transform: scale(.98);
        }

        /* ------------------------------
           GAME UI
        ------------------------------ */

        #gameUI {
            position: absolute;
            inset: 0;
            z-index: 20;

            pointer-events: none;
        }

        #hud {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 8px;
        }

        .hudCard {
            min-width: 0;

            padding: 9px 12px;

            border-radius: 14px;

            background:
                rgba(9,13,24,.82);

            border:
                1px solid
                rgba(255,255,255,.08);

            backdrop-filter:
                blur(12px);

            box-shadow:
                0 8px 30px
                rgba(0,0,0,.2);
        }

        .hudLabel {
            color: #7e89a3;
            font-size: 10px;
        }

        .hudValue {
            margin-top: 2px;
            font-size: 14px;
            font-weight: 800;
        }

        #nexValue {
            color: #f5d76e;
        }

        #energyValue {
            color: #69d9ff;
        }

        #levelValue {
            color: #a88cff;
        }

        /* ------------------------------
           LOCATION
        ------------------------------ */

        #locationInfo {
            position: absolute;
            top: 88px;
            left: 50%;
            transform: translateX(-50%);

            padding: 9px 16px;

            border-radius: 20px;

            background:
                rgba(8,12,22,.72);

            border:
                1px solid
                rgba(255,255,255,.08);

            color: #c8d0e2;

            font-size: 12px;

            backdrop-filter:
                blur(10px);
        }

        /* ------------------------------
           ACTION PANEL
        ------------------------------ */

        #actionPanel {
            position: absolute;

            left: 14px;
            right: 14px;
            bottom: 94px;

            display: none;

            padding: 16px;

            border-radius: 20px;

            background:
                rgba(10,15,27,.92);

            border:
                1px solid
                rgba(255,255,255,.09);

            backdrop-filter:
                blur(18px);

            pointer-events: auto;
        }

        #actionTitle {
            font-size: 18px;
            font-weight: 800;
        }

        #actionDescription {
            margin-top: 7px;

            color: #929bb0;
            font-size: 13px;
            line-height: 1.7;
        }

        .actionButtons {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .actionButton {
            flex: 1;

            padding: 12px;

            border: 0;
            border-radius: 12px;

            background: #6575ff;
            color: #ffffff;

            font-weight: 800;
        }

        .closeButton {
            background: #252d40;
        }

        /* ------------------------------
           MOVEMENT
        ------------------------------ */

        #movement {
            position: absolute;

            bottom: 112px;
            left: 16px;

            width: 132px;
            height: 132px;

            pointer-events: auto;
        }

        .moveButton {
            position: absolute;

            width: 42px;
            height: 42px;

            border-radius: 13px;

            border:
                1px solid
                rgba(255,255,255,.1);

            background:
                rgba(10,15,27,.82);

            color: #ffffff;

            font-size: 18px;
            font-weight: 900;

            backdrop-filter:
                blur(10px);
        }

        .moveButton:active {
            background: #6575ff;
        }

        #moveUp {
            top: 0;
            left: 45px;
        }

        #moveLeft {
            top: 45px;
            left: 0;
        }

        #moveRight {
            top: 45px;
            right: 0;
        }

        #moveDown {
            bottom: 0;
            left: 45px;
        }

        /* ------------------------------
           BOTTOM NAV
        ------------------------------ */

        #bottomNav {
            position: absolute;

            left: 10px;
            right: 10px;
            bottom: 10px;

            height: 70px;

            display: grid;
            grid-template-columns:
                repeat(5, 1fr);

            gap: 5px;

            padding: 7px;

            border-radius: 22px;

            background:
                rgba(9,13,24,.92);

            border:
                1px solid
                rgba(255,255,255,.08);

            backdrop-filter:
                blur(18px);

            pointer-events: auto;
        }

        .navButton {
            border: 0;
            border-radius: 15px;

            background: transparent;
            color: #69748e;

            font-size: 10px;
            font-weight: 700;
        }

        .navButton.active {
            background: #171f34;
            color: #ffffff;
        }

        .navIcon {
            display: block;
            font-size: 19px;
            margin-bottom: 3px;
        }

        /* ------------------------------
           MODAL
        ------------------------------ */

        #modalLayer {
            position: absolute;
            inset: 0;
            z-index: 100;

            display: none;

            align-items: flex-end;

            background:
                rgba(0,0,0,.5);

            pointer-events: auto;
        }

        .modal {
            width: 100%;
            max-height: 82%;

            padding: 20px;

            border-radius:
                26px 26px 0 0;

            background:
                #101727;

            border-top:
                1px solid
                rgba(255,255,255,.08);

            overflow-y: auto;
        }

        .modalHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modalTitle {
            font-size: 21px;
            font-weight: 900;
        }

        .modalClose {
            width: 36px;
            height: 36px;

            border: 0;
            border-radius: 12px;

            background: #202a3e;
            color: #ffffff;

            font-size: 18px;
        }

        .modalContent {
            margin-top: 18px;
        }

        /* ------------------------------
           RESPONSIVE
        ------------------------------ */

        @media (min-width: 700px) {

            #hud {
                left: 24px;
                right: 24px;
            }

            #actionPanel {
                left: 24px;
                right: auto;
                width: 380px;
                bottom: 110px;
            }

            #bottomNav {
                left: 50%;
                right: auto;
                width: 520px;
                transform: translateX(-50%);
            }

        }

    </style>

</head>


<body>

<div id="app">

    <div id="game"></div>


    <!-- LOADING -->

    <section id="loadingScreen">

        <div class="loadingBox">

            <div class="logo">
                NEXUS
            </div>

            <div class="logoSub">
                شهر مخفی
            </div>

            <div class="loadingBar">

                <div
                    class="loadingProgress">
                </div>

            </div>

        </div>

    </section>


    <!-- LANGUAGE -->

    <section id="languageScreen">

        <div class="languageBox">

            <div class="languageTitle">
                NEXUS
            </div>

            <div
                class="languageText"
                data-i18n="chooseLanguage"
            >
                زبان خود را انتخاب کنید
            </div>

            <div class="languageButtons">

                <button
                    class="languageButton"
                    id="faLanguage"
                >
                    فارسی
                </button>

                <button
                    class="languageButton"
                    id="enLanguage"
                >
                    English
                </button>

            </div>

        </div>

    </section>


    <!-- GAME UI -->

    <section id="gameUI">


        <!-- HUD -->

        <div id="hud">

            <div class="hudCard">

                <div
                    class="hudLabel"
                    data-i18n="nex"
                >
                    NEX
                </div>

                <div
                    class="hudValue"
                    id="nexValue"
                >
                    0
                </div>

            </div>


            <div class="hudCard">

                <div
                    class="hudLabel"
                    data-i18n="energy"
                >
                    انرژی
                </div>

                <div
                    class="hudValue"
                    id="energyValue"
                >
                    100
                </div>

            </div>


            <div class="hudCard">

                <div
                    class="hudLabel"
                    data-i18n="level"
                >
                    سطح
                </div>

                <div
                    class="hudValue"
                    id="levelValue"
                >
                    1
                </div>

            </div>

        </div>


        <!-- LOCATION -->

        <div id="locationInfo">
            شهر مرکزی
        </div>


        <!-- ACTION -->

        <div id="actionPanel">

            <div id="actionTitle">
                ساختمان
            </div>

            <div id="actionDescription">
                برای ورود انتخاب کنید.
            </div>

            <div class="actionButtons">

                <button
                    class="actionButton"
                    id="enterBuilding"
                >
                    ورود
                </button>

                <button
                    class="actionButton closeButton"
                    id="closeAction"
                >
                    بستن
                </button>

            </div>

        </div>


        <!-- MOVEMENT -->

        <div id="movement">

            <button
                class="moveButton"
                id="moveUp"
            >
                ▲
            </button>

            <button
                class="moveButton"
                id="moveLeft"
            >
                ◀
            </button>

            <button
                class="moveButton"
                id="moveRight"
            >
                ▶
            </button>

            <button
                class="moveButton"
                id="moveDown"
            >
                ▼
            </button>

        </div>


        <!-- NAVIGATION -->

        <nav id="bottomNav">

            <button
                class="navButton active"
                data-page="city"
            >
                <span class="navIcon">🏙️</span>
                <span data-i18n="city">
                    شهر
                </span>
            </button>


            <button
                class="navButton"
                data-page="operations"
            >
                <span class="navIcon">🎯</span>
                <span data-i18n="operations">
                    عملیات
                </span>
            </button>


            <button
                class="navButton"
                data-page="market"
            >
                <span class="navIcon">🛒</span>
                <span data-i18n="market">
                    بازار
                </span>
            </button>


            <button
                class="navButton"
                data-page="ranking"
            >
                <span class="navIcon">🏆</span>
                <span data-i18n="ranking">
                    رتبه‌بندی
                </span>
            </button>


            <button
                class="navButton"
                data-page="profile"
            >
                <span class="navIcon">👤</span>
                <span data-i18n="profile">
                    پروفایل
                </span>
            </button>

        </nav>


    </section>


    <!-- MODAL -->

    <section id="modalLayer">

        <div class="modal">

            <div class="modalHeader">

                <div
                    class="modalTitle"
                    id="modalTitle"
                >
                    NEXUS
                </div>

                <button
                    class="modalClose"
                    id="modalClose"
                >
                    ×
                </button>

            </div>

            <div
                class="modalContent"
                id="modalContent"
            >
            </div>

        </div>

    </section>

</div>


<!-- Telegram -->

<script src="https://telegram.org/js/telegram-web-app.js"></script>


<!-- Three.js -->

<script type="importmap">
{
    "imports": {
        "three":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<!-- Main Game -->

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
}
from
"three/addons/controls/OrbitControls.js";


/* --------------------------------
   TELEGRAM
-------------------------------- */

const tg =
    window.Telegram?.WebApp;

if (tg) {

    tg.ready();

    tg.expand();

}


/* --------------------------------
   STATE
-------------------------------- */

const state = {

    language:
        localStorage.getItem(
            "nexus_language"
        ),

    nex:
        Number(
            localStorage.getItem(
                "nexus_nex"
            ) || 0
        ),

    energy:
        Number(
            localStorage.getItem(
                "nexus_energy"
            ) || 100
        ),

    level:
        Number(
            localStorage.getItem(
                "nexus_level"
            ) || 1
        ),

    xp:
        Number(
            localStorage.getItem(
                "nexus_xp"
            ) || 0
        )

};


/* --------------------------------
   ELEMENTS
-------------------------------- */

const game =
    document.getElementById(
        "game"
    );

const loadingScreen =
    document.getElementById(
        "loadingScreen"
    );

const languageScreen =
    document.getElementById(
        "languageScreen"
    );

const gameUI =
    document.getElementById(
        "gameUI"
    );

const nexValue =
    document.getElementById(
        "nexValue"
    );

const energyValue =
    document.getElementById(
        "energyValue"
    );

const levelValue =
    document.getElementById(
        "levelValue"
    );


/* --------------------------------
   HUD
-------------------------------- */

function updateHUD() {

    nexValue.textContent =
        state.nex.toLocaleString();

    energyValue.textContent =
        state.energy;

    levelValue.textContent =
        state.level;

}


function saveState() {

    localStorage.setItem(
        "nexus_language",
        state.language || ""
    );

    localStorage.setItem(
        "nexus_nex",
        state.nex
    );

    localStorage.setItem(
        "nexus_energy",
        state.energy
    );

    localStorage.setItem(
        "nexus_level",
        state.level
    );

    localStorage.setItem(
        "nexus_xp",
        state.xp
    );

}


/* --------------------------------
   LANGUAGE
-------------------------------- */

const translations = {

    fa: {

        chooseLanguage:
            "زبان خود را انتخاب کنید",

        nex:
            "NEX",

        energy:
            "انرژی",

        level:
            "سطح",

        city:
            "شهر",

        operations:
            "عملیات",

        market:
            "بازار",

        ranking:
            "رتبه‌بندی",

        profile:
            "پروفایل"

    },

    en: {

        chooseLanguage:
            "Choose your language",

        nex:
            "NEX",

        energy:
            "Energy",

        level:
            "Level",

        city:
            "City",

        operations:
            "Operations",

        market:
            "Market",

        ranking:
            "Ranking",

        profile:
            "Profile"

    }

};


function applyLanguage() {

    const lang =
        state.language || "fa";

    document.documentElement.lang =
        lang;

    document.documentElement.dir =
        lang === "fa"
            ? "rtl"
            : "ltr";

    document
        .querySelectorAll(
            "[data-i18n]"
        )
        .forEach(element => {

            const key =
                element.dataset.i18n;

            element.textContent =
                translations[
                    lang
                ][key] || key;

        });

}


function chooseLanguage(
    lang
) {

    state.language =
        lang;

    saveState();

    applyLanguage();

    languageScreen.style.display =
        "none";

    gameUI.style.display =
        "block";

    updateHUD();

}


/* --------------------------------
   LANGUAGE BUTTONS
-------------------------------- */

document
    .getElementById(
        "faLanguage"
    )
    .addEventListener(
        "click",
        () => chooseLanguage("fa")
    );


document
    .getElementById(
        "enLanguage"
    )
    .addEventListener(
        "click",
        () => chooseLanguage("en")
    );


/* --------------------------------
   THREE.JS
-------------------------------- */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x070a12
    );


const camera =
    new THREE.PerspectiveCamera(
        55,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );


camera.position.set(
    18,
    18,
    18
);


const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


game.appendChild(
    renderer.domElement
);


/* --------------------------------
   LIGHTING
-------------------------------- */

const ambient =
    new THREE.HemisphereLight(
        0x9eb7ff,
        0x101522,
        1.8
    );

scene.add(
    ambient
);


const moon =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

moon.position.set(
    15,
    30,
    10
);

scene.add(
    moon
);


/* --------------------------------
   GROUND
-------------------------------- */

const groundGeometry =
    new THREE.PlaneGeometry(
        120,
        120
    );


const groundMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x111827,
        roughness: 0.92
    });


const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );


ground.rotation.x =
    -Math.PI / 2;

scene.add(
    ground
);


/* --------------------------------
   CITY
-------------------------------- */

const buildings = [];


function createBuilding(
    name,
    x,
    z,
    width,
    height,
    depth,
    color
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );


    const material =
        new THREE.MeshStandardMaterial({
            color,
            roughness: .65,
            metalness: .1
        });


    const building =
        new THREE.Mesh(
            geometry,
            material
        );


    building.position.set(
        x,
        height / 2,
        z
    );


    building.userData.name =
        name;


    scene.add(
        building
    );


    buildings.push(
        building
    );

}


createBuilding(
    "NEXUS HQ",
    0,
    -12,
    8,
    15,
    8,
    0x354b7d
);


createBuilding(
    "BANK",
    13,
    2,
    7,
    11,
    7,
    0x355f62
);


createBuilding(
    "INTELLIGENCE",
    -13,
    3,
    7,
    14,
    7,
    0x553d72
);


createBuilding(
    "MARKET",
    2,
    14,
    10,
    8,
    7,
    0x675336
);


/* --------------------------------
   PLAYER
-------------------------------- */

const playerGeometry =
    new THREE.CapsuleGeometry(
        0.65,
        1.2,
        8,
        16
    );


const playerMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x6d7cff,
        roughness: .4,
        metalness: .15
    });


const player =
    new THREE.Mesh(
        playerGeometry,
        playerMaterial
    );


player.position.set(
    0,
    1.2,
    8
);


scene.add(
    player
);


/* --------------------------------
   CAMERA
-------------------------------- */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping =
    true;

controls.dampingFactor =
    .08;

controls.maxPolarAngle =
    Math.PI / 2.05;

controls.minDistance =
    8;

controls.maxDistance =
    45;

controls.target.copy(
    player.position
);


/* --------------------------------
   MOVEMENT
-------------------------------- */

const movement = {

    up: false,
    down: false,
    left: false,
    right: false

};


const speed =
    0.13;


function movePlayer() {

    let dx = 0;
    let dz = 0;

    if (movement.up)
        dz -= speed;

    if (movement.down)
        dz += speed;

    if (movement.left)
        dx -= speed;

    if (movement.right)
        dx += speed;


    player.position.x +=
        dx;

    player.position.z +=
        dz;


    controls.target.copy(
        player.position
    );

}


function setupMovementButton(
    id,
    direction
) {

    const button =
        document.getElementById(id);


    const start = event => {

        event.preventDefault();

        movement[
            direction
        ] = true;

    };


    const stop = event => {

        event.preventDefault();

        movement[
            direction
        ] = false;

    };


    button.addEventListener(
        "pointerdown",
        start
    );

    button.addEventListener(
        "pointerup",
        stop
    );

    button.addEventListener(
        "pointercancel",
        stop
    );

    button.addEventListener(
        "pointerleave",
        stop
    );

}


setupMovementButton(
    "moveUp",
    "up"
);

setupMovementButton(
    "moveDown",
    "down"
);

setupMovementButton(
    "moveLeft",
    "left"
);

setupMovementButton(
    "moveRight",
    "right"
);


/* --------------------------------
   KEYBOARD
-------------------------------- */

window.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "w" ||
            event.key === "ArrowUp"
        )
            movement.up = true;

        if (
            event.key === "s" ||
            event.key === "ArrowDown"
        )
            movement.down = true;

        if (
            event.key === "a" ||
            event.key === "ArrowLeft"
        )
            movement.left = true;

        if (
            event.key === "d" ||
            event.key === "ArrowRight"
        )
            movement.right = true;

    }
);


window.addEventListener(
    "keyup",
    event => {

        if (
            event.key === "w" ||
            event.key === "ArrowUp"
        )
            movement.up = false;

        if (
            event.key === "s" ||
            event.key === "ArrowDown"
        )
            movement.down = false;

        if (
            event.key === "a" ||
            event.key === "ArrowLeft"
        )
            movement.left = false;

        if (
            event.key === "d" ||
            event.key === "ArrowRight"
        )
            movement.right = false;

    }
);


/* --------------------------------
   BUILDING INTERACTION
-------------------------------- */

const raycaster =
    new THREE.Raycaster();

const pointer =
    new THREE.Vector2();


const actionPanel =
    document.getElementById(
        "actionPanel"
    );

const actionTitle =
    document.getElementById(
        "actionTitle"
    );

const actionDescription =
    document.getElementById(
        "actionDescription"
    );


renderer.domElement.addEventListener(
    "pointerdown",
    event => {

        pointer.x =
            (event.clientX /
                window.innerWidth) *
                2 - 1;

        pointer.y =
            -(event.clientY /
                window.innerHeight) *
                2 + 1;


        raycaster.setFromCamera(
            pointer,
            camera
        );


        const hits =
            raycaster.intersectObjects(
                buildings
            );


        if (
            hits.length
        ) {

            const building =
                hits[0].object;

            actionTitle.textContent =
                building.userData.name;

            actionDescription.textContent =
                state.language === "en"
                    ? "Select enter to open this location."
                    : "برای ورود به این مکان انتخاب کنید.";

            actionPanel.style.display =
                "block";

        }

    }
);


document
    .getElementById(
        "closeAction"
    )
    .addEventListener(
        "click",
        () => {

            actionPanel.style.display =
                "none";

        }
    );


document
    .getElementById(
        "enterBuilding"
    )
    .addEventListener(
        "click",
        () => {

            const title =
                actionTitle.textContent;

            openModal(
                title,
                state.language === "en"
                    ? "This location will contain its own gameplay system."
                    : "سیستم اختصاصی این مکان در مراحل بعدی فعال می‌شود."
            );

            actionPanel.style.display =
                "none";

        }
    );


/* --------------------------------
   MODAL
-------------------------------- */

const modalLayer =
    document.getElementById(
        "modalLayer"
    );

const modalTitle =
    document.getElementById(
        "modalTitle"
    );

const modalContent =
    document.getElementById(
        "modalContent"
    );


function openModal(
    title,
    content
) {

    modalTitle.textContent =
        title;

    modalContent.textContent =
        content;

    modalLayer.style.display =
        "flex";

}


document
    .getElementById(
        "modalClose"
    )
    .addEventListener(
        "click",
        () => {

            modalLayer.style.display =
                "none";

        }
    );


/* --------------------------------
   NAVIGATION
-------------------------------- */

document
    .querySelectorAll(
        ".navButton"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".navButton"
                    )
                    .forEach(
                        b =>
                            b.classList
                                .remove(
                                    "active"
                                )
                    );

                button.classList.add(
                    "active"
                );


                const page =
                    button.dataset.page;


                if (
                    page === "city"
                ) {
                    return;
                }


                const titles = {

                    operations:
                        state.language === "en"
                            ? "Operations"
                            : "عملیات",

                    market:
                        state.language === "en"
                            ? "Market"
                            : "بازار",

                    ranking:
                        state.language === "en"
                            ? "Ranking"
                            : "رتبه‌بندی",

                    profile:
                        state.language === "en"
                            ? "Profile"
                            : "پروفایل"

                };


                openModal(
                    titles[page],
                    state.language === "en"
                        ? "This section will be connected to the complete game system."
                        : "این بخش در مرحله بعد به سیستم کامل بازی متصل می‌شود."
                );

            }
        );

    });


/* --------------------------------
   RESIZE
-------------------------------- */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* --------------------------------
   ANIMATION
-------------------------------- */

function animate() {

    requestAnimationFrame(
        animate
    );

    movePlayer();

    controls.update();

    renderer.render(
        scene,
        camera
    );

}


animate();


/* --------------------------------
   START
-------------------------------- */

setTimeout(
    () => {

        loadingScreen.style.display =
            "none";


        if (
            state.language === "fa" ||
            state.language === "en"
        ) {

            applyLanguage();

            gameUI.style.display =
                "block";

        } else {

            languageScreen.style.display =
                "flex";

            gameUI.style.display =
                "none";

        }


        updateHUD();

    },
    1200
);

</script>

</body>

</html>
