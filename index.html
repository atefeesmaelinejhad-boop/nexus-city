<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>NEXUS | شهر مخفی</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050810;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    button {
      font-family: inherit;
    }

    /* LANGUAGE */

    #language-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 35%, #162944 0%, #09101d 45%, #03050a 100%);
    }

    .language-box {
      width: min(380px, calc(100% - 40px));
      padding: 35px 25px;
      text-align: center;
      background: rgba(12, 20, 34, 0.96);
      border: 1px solid rgba(77, 211, 255, 0.25);
      border-radius: 24px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.55);
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 5px;
      color: #55d6ff;
      text-shadow: 0 0 25px rgba(85, 214, 255, 0.55);
    }

    .subtitle {
      margin: 12px 0 28px;
      color: #9caac0;
      font-size: 14px;
    }

    .lang-button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border: 1px solid rgba(85, 214, 255, 0.2);
      border-radius: 14px;
      background: #17253b;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .lang-button:active {
      transform: scale(0.98);
    }

    /* GAME */

    #game-container {
      position: fixed;
      inset: 0;
      display: none;
      background: #050810;
    }

    #game-container.active {
      display: block;
    }

    #city {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #city canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD */

    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      gap: 7px;
      pointer-events: none;
    }

    .hud-item {
      flex: 1;
      min-width: 0;
      padding: 9px 8px;
      text-align: center;
      border: 1px solid rgba(85, 214, 255, 0.2);
      border-radius: 13px;
      background: rgba(6, 12, 22, 0.86);
      backdrop-filter: blur(8px);
    }

    .hud-label {
      color: #7f8da4;
      font-size: 10px;
      margin-bottom: 4px;
    }

    .hud-value {
      font-size: 14px;
      font-weight: bold;
      color: white;
    }

    #city-value-box {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 8px 15px;
      border-radius: 14px;
      background: rgba(6, 12, 22, 0.82);
      border: 1px solid rgba(85, 214, 255, 0.18);
      color: #dbe8f8;
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
    }

    /* MOVEMENT */

    #movement {
      position: absolute;
      bottom: 88px;
      left: 14px;
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(2, 48px);
      gap: 5px;
    }

    .move-button {
      border: 1px solid rgba(85, 214, 255, 0.2);
      border-radius: 13px;
      background: rgba(7, 14, 26, 0.88);
      color: white;
      font-size: 18px;
    }

    .move-up {
      grid-column: 2;
    }

    .move-left {
      grid-column: 1;
      grid-row: 2;
    }

    .move-down {
      grid-column: 2;
      grid-row: 2;
    }

    .move-right {
      grid-column: 3;
      grid-row: 2;
    }

    /* ACTION */

    #action-panel {
      position: absolute;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%);
      z-index: 25;
      display: none;
      width: min(330px, calc(100% - 150px));
    }

    .action-box {
      padding: 15px;
      text-align: center;
      border: 1px solid rgba(85, 214, 255, 0.25);
      border-radius: 18px;
      background: rgba(7, 13, 24, 0.94);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    }

    #action-title {
      margin-bottom: 7px;
      color: #55d6ff;
      font-size: 17px;
      font-weight: bold;
    }

    #action-description {
      margin-bottom: 12px;
      color: #a7b4c8;
      font-size: 12px;
    }

    #action-button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: #55d6ff;
      color: #041019;
      font-weight: bold;
      cursor: pointer;
    }

    /* BOTTOM NAV */

    #bottom-nav {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 40;
      height: 68px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid rgba(85, 214, 255, 0.15);
      background: rgba(5, 9, 17, 0.96);
      backdrop-filter: blur(12px);
    }

    .nav-button {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 4px;
      border: 0;
      background: transparent;
      color: #75839a;
      font-size: 10px;
      cursor: pointer;
    }

    .nav-button.active {
      color: #55d6ff;
    }

    .nav-icon {
      font-size: 19px;
    }

    /* MODAL */

    #modal {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.68);
    }

    #modal.active {
      display: flex;
    }

    .modal-box {
      width: min(410px, 100%);
      max-height: 80vh;
      overflow-y: auto;
      padding: 20px;
      border: 1px solid rgba(85, 214, 255, 0.25);
      border-radius: 22px;
      background: #0d1626;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.65);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    #modal-title {
      color: #55d6ff;
      font-size: 20px;
      font-weight: bold;
    }

    #modal-close {
      width: 35px;
      height: 35px;
      border: 0;
      border-radius: 50%;
      background: #18253a;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    #modal-content {
      color: #d2dbea;
      font-size: 14px;
      line-height: 1.9;
    }

    .modal-option {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: 1px solid rgba(85, 214, 255, 0.15);
      border-radius: 12px;
      background: #17253b;
      color: white;
      text-align: right;
      cursor: pointer;
    }

    /* MOBILE */

    @media (max-width: 500px) {
      #hud {
        gap: 4px;
      }

      .hud-item {
        padding: 8px 5px;
      }

      .hud-value {
        font-size: 12px;
      }

      #action-panel {
        width: calc(100% - 145px);
      }
    }
  </style>
</head>

<body>

  <!-- LANGUAGE SCREEN -->

  <section id="language-screen">

    <div class="language-box">

      <div class="logo">NEXUS</div>

      <div class="subtitle">
        شهر مخفی در انتظار توست
      </div>

      <button
        id="fa-button"
        class="lang-button"
        type="button">
        🇮🇷 فارسی
      </button>

      <button
        id="en-button"
        class="lang-button"
        type="button">
        🇬🇧 English
      </button>

    </div>

  </section>


  <!-- GAME -->

  <main id="game-container">

    <div id="city"></div>


    <!-- HUD -->

    <div id="hud">

      <div class="hud-item">
        <div class="hud-label" id="nex-label">NEX</div>
        <div class="hud-value" id="nex-value">10,000</div>
      </div>

      <div class="hud-item">
        <div class="hud-label" id="energy-label">انرژی</div>
        <div class="hud-value" id="energy-value">100</div>
      </div>

      <div class="hud-item">
        <div class="hud-label" id="level-label">سطح</div>
        <div class="hud-value" id="level-value">1</div>
      </div>

    </div>


    <!-- CITY VALUE -->

    <div id="city-value-box">
      🏙️
      <span id="city-value-label">ارزش شهر</span>:
      <span id="city-value">100,000</span>
    </div>


    <!-- BUILDING ACTION -->

    <div id="action-panel">

      <div class="action-box">

        <div id="action-title">
          ساختمان
        </div>

        <div id="action-description"></div>

        <button
          id="action-button"
          type="button">
          ورود
        </button>

      </div>

    </div>


    <!-- MOVEMENT -->

    <div id="movement">

      <button
        class="move-button move-up"
        data-direction="up"
        type="button">
        ▲
      </button>

      <button
        class="move-button move-left"
        data-direction="left"
        type="button">
        ◀
      </button>

      <button
        class="move-button move-down"
        data-direction="down"
        type="button">
        ▼
      </button>

      <button
        class="move-button move-right"
        data-direction="right"
        type="button">
        ▶
      </button>

    </div>


    <!-- BOTTOM NAV -->

    <nav id="bottom-nav">

      <button
        class="nav-button active"
        data-page="operations"
        type="button">
        <span class="nav-icon">🎯</span>
        <span id="nav-operations">عملیات</span>
      </button>

      <button
        class="nav-button"
        data-page="missions"
        type="button">
        <span class="nav-icon">📁</span>
        <span id="nav-missions">ماموریت</span>
      </button>

      <button
        class="nav-button"
        data-page="market"
        type="button">
        <span class="nav-icon">🛒</span>
        <span id="nav-market">بازار</span>
      </button>

      <button
        class="nav-button"
        data-page="ranking"
        type="button">
        <span class="nav-icon">🏆</span>
        <span id="nav-ranking">رتبه‌بندی</span>
      </button>

      <button
        class="nav-button"
        data-page="profile"
        type="button">
        <span class="nav-icon">👤</span>
        <span id="nav-profile">پروفایل</span>
      </button>

    </nav>

  </main>


  <!-- MODAL -->

  <div id="modal">

    <div class="modal-box">

      <div class="modal-header">

        <div id="modal-title">
          NEXUS
        </div>

        <button
          id="modal-close"
          type="button">
          ×
        </button>

      </div>

      <div id="modal-content"></div>

    </div>

  </div>


  <!-- GAME ENGINE -->

<script src="./game.js"></script>
